<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MRSHADOW · Suggestions</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #070d1a; color: #eef2ff; padding: 24px 16px 60px; }
  .wrap { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; } .sub { color: #94a3b8; margin: 0 0 20px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  input, select { flex: 1; min-width: 160px; padding: 12px 14px; border-radius: 12px; border: 1px solid #263148; background: #0f172a; color: inherit; font-size: 1rem; }
  button { padding: 10px 16px; border-radius: 12px; border: 0; font-weight: 700; cursor: pointer; font-size: 0.9rem; color: #fff; background: #5b4cf0; }
  button.no { background: #d6336c; } button.ghost { background: #1e293b; } button:disabled { opacity: .5; cursor: wait; }
  .card { background: #0f172a; border: 1px solid #263148; border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
  .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .78rem; color: #94a3b8; margin-bottom: 8px; }
  .cat { color: #a5b4fc; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
  .idea { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
  .act { display: flex; gap: 8px; margin-top: 12px; }
  .msg { margin: 12px 0; color: #94a3b8; min-height: 1.2em; } .msg.bad { color: #ff7b72; } .empty { color: #94a3b8; padding: 14px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Suggestion box</h1>
  <p class="sub">Only you can use this page. Ideas from your visitors appear here, newest first.</p>
  <form class="row" id="f"><input id="key" type="password" placeholder="Admin key" autocomplete="current-password" required><button type="submit">Load</button><button type="button" class="ghost" id="out" hidden>Sign out</button></form>
  <div class="row" id="filters" hidden><select id="cat"><option value="">All topics</option><option>Tech</option><option>Share Market</option><option>Life Vlog</option><option>Other</option></select><button type="button" class="ghost" id="copy">Copy all</button></div>
  <div class="msg" id="msg"></div>
  <div id="list"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
let key = '', items = []; try { key = sessionStorage.getItem('adm') || ''; } catch (e) {}
function say(t, bad) { $('msg').textContent = t || ''; $('msg').className = 'msg' + (bad ? ' bad' : ''); }
async function api(method, body) {
  const r = await fetch('/api/suggestions', { method, headers: { 'x-admin-key': key, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'Error ' + r.status); return d;
}
function render() {
  const f = $('cat').value, shown = items.filter((i) => !f || i.category === f), box = $('list'); box.replaceChildren();
  if (!shown.length) { const d = document.createElement('div'); d.className = 'empty'; d.textContent = items.length ? 'No suggestions in this topic.' : 'No suggestions yet.'; box.append(d); }
  shown.forEach((it) => {
    const c = document.createElement('div'); c.className = 'card';
    const top = document.createElement('div'); top.className = 'top';
    const l = document.createElement('span'); const cat = document.createElement('span'); cat.className = 'cat'; cat.textContent = it.category; l.append(cat, document.createTextNode(it.name ? '  ·  ' + it.name : '  ·  anonymous')); 
    const r = document.createElement('span'); r.textContent = new Date(it.at).toLocaleString(); top.append(l, r);
    const idea = document.createElement('div'); idea.className = 'idea'; idea.textContent = it.idea;
    const act = document.createElement('div'); act.className = 'act';
    const del = document.createElement('button'); del.className = 'no'; del.textContent = 'Delete';
    del.onclick = async () => { if (!confirm('Delete this suggestion?')) return; del.disabled = true; try { await api('POST', { action: 'delete', path: it.path }); items = items.filter((x) => x !== it); render(); } catch (e) { say(e.message, true); del.disabled = false; } };
    act.append(del); c.append(top, idea, act); box.append(c);
  });
}
async function load() {
  say('Loading…');
  try { items = (await api('GET')).items; $('filters').hidden = false; $('out').hidden = false; say(items.length + ' suggestion' + (items.length === 1 ? '' : 's')); render(); }
  catch (e) { say(e.message, true); $('out').hidden = true; $('filters').hidden = true; $('list').replaceChildren(); if (/key/i.test(e.message)) { key = ''; try { sessionStorage.removeItem('adm'); } catch (x) {} } }
}
$('f').onsubmit = (e) => { e.preventDefault(); key = $('key').value; try { sessionStorage.setItem('adm', key); } catch (x) {} load(); };
$('out').onclick = () => { key = ''; try { sessionStorage.removeItem('adm'); } catch (x) {} location.reload(); };
$('cat').onchange = render;
$('copy').onclick = () => { const t = items.filter((i) => !$('cat').value || i.category === $('cat').value).map((i) => '[' + i.category + '] ' + i.idea + (i.name ? ' (' + i.name + ')' : '')).join('\n\n'); navigator.clipboard.writeText(t).then(() => say('Copied.'), () => say('Could not copy.', true)); };
if (key) load();
</script>
</body>
</html>
